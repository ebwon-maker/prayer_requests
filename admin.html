<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캄보디아 기도 릴레이 - 관리자 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal-deep: #0E3B3D;
    --border: #E2E8F0;
    --danger: #B4483C;
    --success: #2E7D32;
  }

  * { box-sizing: border-box; }
  
  /* 드래그 및 선택 방지 CSS */
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background-color: #f8f9fa;
    color: #333;
    margin: 0;
    padding: 20px;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }

  /* 인라인 로그인 박스 */
  #loginContainer {
    max-width: 400px;
    margin: 80px auto;
    background: #ffffff;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    text-align: center;
  }
  #loginContainer h2 {
    color: var(--teal-deep);
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 20px;
  }
  #loginContainer input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
  }
  #loginContainer button {
    width: 100%;
    padding: 12px;
    background: var(--teal-deep);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
  }
  #loginErr {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* 인증 성공 전까지 숨김 */
  .admin-container {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
    background: #ffffff;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  h1 { font-size: 22px; color: var(--teal-deep); margin: 0; }
  .stats { font-size: 14px; color: #666; }
  .stats strong { color: var(--teal-deep); }

  .action-btns { display: flex; gap: 10px; }
  .btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-excel { background: #107C41; color: #fff; }
  .btn-delete-all { background: var(--danger); color: #fff; }

  .btn-sm-del {
    background: #fff;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-sm-del:hover { background: var(--danger); color: #fff; }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 13px;
  }

  th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  th { background: #f1f5f9; color: var(--teal-deep); font-weight: 700; }
  tr:hover { background: #f8fafc; }

  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  .badge-yes { background: #E8F5E9; color: var(--success); }
  .badge-no { background: #FFEBEE; color: var(--danger); }

  .msg-cell { max-width: 250px; word-break: break-all; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>

<!-- 1. 인라인 로그인 폼 -->
<div id="loginContainer">
  <h2>관리자 로그인</h2>
  <form onsubmit="event.preventDefault(); checkAuth();">
    <input type="password" id="adminPw" placeholder="비밀번호를 입력하세요" autocomplete="off">
    <button type="submit">접속하기</button>
  </form>
  <div id="loginErr">비밀번호가 올바르지 않습니다.</div>
</div>

<!-- 2. 관리자 메인 화면 -->
<div class="admin-container" id="adminContent">
  <div class="header-row">
    <div>
      <h1>캄보디아 기도 릴레이 신청 현황</h1>
      <div class="stats" id="statsText">데이터를 불러오는 중…</div>
    </div>
    <div class="action-btns">
      <button class="btn btn-excel" id="excelBtn">📊 엑셀 다운로드</button>
      <button class="btn btn-delete-all" id="deleteAllBtn">🚨 전체 데이터 일괄 파기</button>
    </div>
  </div>

  <div id="tableWrapper">
    <div class="loading">신청 내역을 불러오고 있습니다...</div>
  </div>
</div>

<!-- 🛡️ 우클릭, 드래그 및 개발자도구 단축키 차단 스크립트 -->
<script>
  // 1. 마우스 우클릭 방지
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  }, false);

  // 2. 드래그 방지
  document.addEventListener('dragstart', function(e) {
    e.preventDefault();
  }, false);

  // 3. 보안 단축키 차단 (F12, Ctrl+Shift+I, Ctrl+U, Ctrl+S)
  document.addEventListener('keydown', function(e) {
    // F12 키 차단
    if (e.keyCode === 123) {
      e.preventDefault();
      e.returnValue = false;
    }
    // Ctrl + Shift + I, Ctrl + Shift + J, Ctrl + Shift + C (개발자 도구)
    if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
      e.preventDefault();
      e.returnValue = false;
    }
    // Ctrl + U (소스 보기)
    if (e.ctrlKey && e.keyCode === 85) {
      e.preventDefault();
      e.returnValue = false;
    }
    // Ctrl + S (페이지 저장)
    if (e.ctrlKey && e.keyCode === 83) {
      e.preventDefault();
      e.returnValue = false;
    }
  }, false);
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getFirestore, 
    collection, 
    getDocs, 
    doc, 
    deleteDoc 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCBu_rDPo5M-loPv8UBnvh96JAKi1swbOU",
    authDomain: "ambodia-prayer.firebaseapp.com",
    projectId: "ambodia-prayer",
    storageBucket: "ambodia-prayer.firebasestorage.app",
    messagingSenderId: "463714476310",
    appId: "1:463714476310:web:612f503e5587b1a1ddf037",
    measurementId: "G-3NFLMLR80S"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const ADMIN_PASSWORD = "Farah2015*"; 
  let fetchedData = [];

  // 화면 인라인 로그인 검증 함수
  window.checkAuth = function() {
    const inputPw = document.getElementById('adminPw').value;
    const loginErr = document.getElementById('loginErr');

    if (inputPw === ADMIN_PASSWORD) {
      document.getElementById('loginContainer').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
      loadData();
    } else {
      loginErr.style.display = 'block';
    }
  };

  // 데이터 불러오기
  async function loadData() {
    const tableWrapper = document.getElementById('tableWrapper');
    const statsText = document.getElementById('statsText');

    try {
      const querySnapshot = await getDocs(collection(db, "prayers"));
      
      fetchedData = [];
      querySnapshot.forEach((documentSnap) => {
        fetchedData.push({ id: documentSnap.id, ...documentSnap.data() });
      });

      // 최신순 정렬
      fetchedData.sort((a, b) => {
        const tA = a.createdAt?.toDate ? a.createdAt.toDate().getTime() : 0;
        const tB = b.createdAt?.toDate ? b.createdAt.toDate().getTime() : 0;
        return tB - tA;
      });

      statsText.innerHTML = `총 <strong>${fetchedData.length}</strong>건의 참여가 있습니다.`;

      if (fetchedData.length === 0) {
        tableWrapper.innerHTML = '<div class="loading">접수된 기도 릴레이 내역이 없습니다.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>이름</th>
              <th>연락처</th>
              <th>응원 메시지</th>
              <th>개인정보동의</th>
              <th>마케팅동의</th>
              <th>신청 일시</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
      `;

      fetchedData.forEach((item, index) => {
        const dateStr = item.createdAt?.toDate 
          ? item.createdAt.toDate().toLocaleString('ko-KR') 
          : '일시 미기록';

        html += `
          <tr>
            <td>${fetchedData.length - index}</td>
            <td><strong>${escapeHtml(item.name || '')}</strong></td>
            <td>${escapeHtml(item.contact || '')}</td>
            <td class="msg-cell">${escapeHtml(item.message || '')}</td>
            <td><span class="badge ${item.consent ? 'badge-yes' : 'badge-no'}">${item.consent ? '동의' : '미동의'}</span></td>
            <td><span class="badge ${item.marketingConsent ? 'badge-yes' : 'badge-no'}">${item.marketingConsent ? '동의' : '미동의'}</span></td>
            <td>${dateStr}</td>
            <td><button class="btn-sm-del" data-id="${item.id}">삭제</button></td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      tableWrapper.innerHTML = html;

      // 삭제 버튼
      document.querySelectorAll('.btn-sm-del').forEach(btn => {
        btn.addEventListener('click', (e) => {
          deleteSingleDoc(e.target.getAttribute('data-id'));
        });
      });

    } catch (err) {
      console.error(err);
      tableWrapper.innerHTML = `<div class="loading" style="color:var(--danger)">오류 발생: ${err.message}</div>`;
    }
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // 단건 삭제
  async function deleteSingleDoc(docId) {
    if (!confirm("정말 삭제하시겠습니까?")) return;
    try {
      await deleteDoc(doc(db, "prayers", docId));
      alert("삭제되었습니다.");
      loadData();
    } catch (err) {
      console.error(err);
      alert("삭제 실패: " + err.message);
    }
  }

  // 전체 삭제
  document.getElementById('deleteAllBtn').addEventListener('click', async () => {
    if (fetchedData.length === 0) return alert("삭제할 데이터가 없습니다.");
    if (prompt("전체 삭제하시려면 '일괄파기'를 입력하세요.") !== '일괄파기') return;

    for (const item of fetchedData) {
      try { await deleteDoc(doc(db, "prayers", item.id)); } catch(e){}
    }
    alert("처리되었습니다.");
    loadData();
  });

  // 엑셀 다운로드
  document.getElementById('excelBtn').addEventListener('click', () => {
    if (fetchedData.length === 0) return alert("데이터가 없습니다.");
    let csv = "\uFEFF이름,연락처,응원메시지,개인정보동의,마케팅동의,신청일시\n";
    fetchedData.forEach(item => {
      const dateStr = item.createdAt?.toDate ? item.createdAt.toDate().toLocaleString('ko-KR') : '-';
      csv += `"${item.name||''}","${item.contact||''}","${item.message||''}","${item.consent?'동의':'미동의'}","${item.marketingConsent?'동의':'미동의'}","${dateStr}"\n`;
    });
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `기도릴레이_현황_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  });
</script>
</body>
</html>
